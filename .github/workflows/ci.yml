name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Минимальные права токена: сборка только читает репозиторий.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Build debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  relay:
    name: Relay server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Dependency audit
        run: npm audit --omit=dev || true

      - name: Syntax check
        run: npm run check

      - name: Smoke test (health endpoint)
        run: |
          node relay.js &
          RELAY_PID=$!
          curl -fsS --retry 5 --retry-delay 1 http://127.0.0.1:8080/health
          curl -fsS --retry 5 --retry-delay 1 http://127.0.0.1:8080/ready
          kill $RELAY_PID

  python-tools:
    name: Python tools (PEP 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install pycodestyle==2.12.1 websockets==13.1

      - name: PEP 8
        run: pycodestyle tools

      - name: Syntax check
        run: python -m compileall -q tools

  web-client:
    name: Web client checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: node --check server/web/app.js
