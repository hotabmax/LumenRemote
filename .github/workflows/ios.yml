name: iOS

on:
  push:
    branches: [main, master]
    paths:
      - "ios/**"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build & tests (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Structural check (no Xcode required)
        run: python3 tools/swift_structure_check.py ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild \
            -project LumenRemote.xcodeproj \
            -scheme LumenRemote \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: ios/build/Logs/Test/**
          if-no-files-found: ignore

  unsigned-ipa:
    name: Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Structural check (no Xcode required)
        run: python3 tools/swift_structure_check.py ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: |
          chmod +x ios/build-unsigned.sh
          ./ios/build-unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LumenRemote-unsigned-ipa
          path: ios/build/LumenRemote-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
